version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.new
    container_name: symfony_handmades_app
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - DATABASE_URL=postgresql://symfony:symfony@db:5432/handmades_db
      - MAILER_DSN=smtp://localhost
      - JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
      - JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
      - JWT_PASSPHRASE=your_jwt_passphrase
    volumes:
      - uploads:/var/www/html/public/uploads
      - logs:/var/www/html/var/log
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:13-alpine
    container_name: symfony_handmades_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=handmades_db
      - POSTGRES_USER=symfony
      - POSTGRES_PASSWORD=symfony
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: symfony_handmades_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/html/public/uploads:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: symfony_handmades_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  db_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge

