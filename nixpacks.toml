[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.curl",
    "php83Extensions.mbstring",
    "php83Extensions.intl",
    "php83Extensions.pdo_mysql",
    "php83Extensions.xml",
    "php83Extensions.zip",
    "php83Extensions.gd",
    "php83Extensions.xsl",
    "nodejs",
    "yarn",
]

[phases.install]
cmds = [
    "curl -sS https://getcomposer.org/installer | php -- --install-dir=/bin --filename=composer",
    "npm install -g yarn",
    "export COMPOSER_MEMORY_LIMIT=512M && php /bin/composer install --optimize-autoloader --ignore-platform-req=ext-xsl --no-scripts",
    "yarn install --frozen-lockfile"
]

[phases.build]
cmds = [
    "export NODE_OPTIONS=--openssl-legacy-provider && yarn build"
]

[start]
cmd = "sh -c 'echo \"Waiting for database...\" && until php -r \"try { new PDO(getenv(\\\"DATABASE_URL\\\")); exit(0); } catch (Exception \\$e) { exit(1); }\"; do sleep 2; done && php /bin/composer run-script post-install-cmd && php bin/console cache:clear --no-warmup && php bin/console cache:warmup && php bin/console doctrine:migrations:migrate --no-interaction && php -S 0.0.0.0:3000 -t public'"
