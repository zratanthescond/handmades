[phases.setup]
nixPkgs = [
    "php73",
    "php73Extensions.curl",
    "php73Extensions.mbstring",
    "php73Extensions.intl",
    "php73Extensions.pdo_mysql",
    "php73Extensions.xml",
    "php73Extensions.zip",
    "php73Extensions.gd",
    "php73Extensions.xsl",
    "nodejs"
]

[phases.install]
cmds = [
    # Install Composer manually
    "curl -sS https://getcomposer.org/installer | php -- --install-dir=/bin --filename=composer",
    # Install Yarn manually
     "php -m | grep xsl || echo 'xsl missing, trying to enable it'",
     "php -d extension=xsl.so",
    "npm install -g yarn",
    # Install PHP deps
    "composer install --no-dev --optimize-autoloader ",
    # Install JS deps
    "yarn install --frozen-lockfile"
]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "php -S 0.0.0.0:3000 -t public"
