[phases.setup]
nixPkgs = [
  "composer"
]

[phases.build]
cmds = [
  # Install PHP 7.4 from archived nixpkgs
  "nix-env -iA php74 -f https://github.com/NixOS/nixpkgs/archive/4d2b5b7c5f78b9e1b8c7b57d4ff76bb3c3b1d47b.tar.gz",
  
  # Install Node.js 16 + Yarn
  "nix-env -iA nodejs-16_x -f https://github.com/NixOS/nixpkgs/archive/nixos-21.11.tar.gz",
  "npm install -g yarn",
  
  # Fix LICENSE conflict between Yarn and Composer
  "rm -f $(nix-env -q --out-path yarn | cut -d' ' -f2)/LICENSE || true",
  "rm -f $(nix-env -q --out-path composer | cut -d' ' -f2)/LICENSE || true"
]

[start]
cmd = "php -v && composer install && yarn install && symfony serve --no-tls --port $PORT"
