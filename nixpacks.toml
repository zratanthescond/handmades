[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.curl",
    "php83Extensions.mbstring",
    "php83Extensions.intl",
    "php83Extensions.pdo_mysql",
    "php83Extensions.xml",
    "php83Extensions.zip",
    "php83Extensions.gd",
    "php83Extensions.xsl",
    "nodejs",
    "yarn",
]

[phases.install]
cmds = [
    "curl -sS https://getcomposer.org/installer | php -- --install-dir=/bin --filename=composer",
    "npm install -g yarn",
    "export COMPOSER_MEMORY_LIMIT=512M && php /bin/composer install --optimize-autoloader --ignore-platform-req=ext-xsl --no-scripts",
    "yarn install --frozen-lockfile"
]

[phases.build]
cmds = [
    "export NODE_OPTIONS=--openssl-legacy-provider && yarn build"
]

[start]
cmd = "sh -c 'echo \"Waiting for database...\" && RETRY_COUNT=0 && MAX_RETRIES=30 && while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do if timeout 5 php -r \"try { \\$pdo = new PDO(getenv(\\\"DATABASE_URL\\\"), null, null, [PDO::ATTR_TIMEOUT => 3]); echo \\\"Database connected successfully\\\"; exit(0); } catch (Exception \\$e) { echo \\\"Connection failed: \\\" . \\$e->getMessage(); exit(1); }\"; then echo \"Database is ready!\"; break; else echo \"Database not ready, retrying in 2 seconds... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)\"; RETRY_COUNT=$((RETRY_COUNT + 1)); sleep 2; fi; done && if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then echo \"Database health check failed after $MAX_RETRIES attempts\"; exit 1; fi && echo \"Running post-install scripts...\" && php /bin/composer run-script post-install-cmd && echo \"Clearing cache...\" && php bin/console cache:clear --no-warmup && echo \"Warming up cache...\" && php bin/console cache:warmup && echo \"Running migrations...\" && php bin/console doctrine:migrations:migrate --no-interaction && echo \"Starting PHP server...\" && php -S 0.0.0.0:3000 -t public'"
