[phases.setup]
nixPkgs = ['php83', 'php83Extensions.curl', 'php83Extensions.mbstring', 'php83Extensions.intl', 'php83Extensions.pdo_mysql', 'php83Extensions.xml', 'php83Extensions.zip', 'php83Extensions.gd', 'php83Extensions.xsl', 'nodejs_20', 'yarn']

[phases.install]
cmds = [
    'curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer',
    'npm install -g yarn',
    'php -d memory_limit=-1 /usr/local/bin/composer install --ignore-platform-req=ext-xsl',
    'yarn install --frozen-lockfile'
]

[phases.build]
cmds = ['NODE_OPTIONS="--openssl-legacy-provider" yarn build']

[start]
cmd = 'echo "Waiting for database..." && until php -r "try { new PDO(getenv(\"DATABASE_URL\")); exit(0); } catch (Exception $e) { exit(1); }"; do sleep 2; done && echo "Database connected!" && composer run-script post-install-cmd && php bin/console cache:clear && php bin/console cache:warmup && php bin/console doctrine:migrations:migrate --no-interaction && php -S 0.0.0.0:3000 -t public'
