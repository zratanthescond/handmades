version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: symfony_handmades_simple
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - DATABASE_URL=postgresql://symfony:symfony@db:5432/handmades_db
    ports:
      - "8080:80"
    volumes:
      - uploads:/var/www/html/public/uploads
      - logs:/var/www/html/var/log
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:13-alpine
    container_name: symfony_handmades_db_simple
    restart: unless-stopped
    environment:
      - POSTGRES_DB=handmades_db
      - POSTGRES_USER=symfony
      - POSTGRES_PASSWORD=symfony
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

volumes:
  db_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local

networks:
  app-network:
    driver: bridge

